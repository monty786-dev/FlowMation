name: Build FlowBrowser

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: ./tools/fetch-webview2.ps1

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $name = "FlowBrowser-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path dist/$name | Out-Null
          Copy-Item build/Release/FlowBrowser.exe dist/$name/
          Copy-Item README.md dist/$name/README.md
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FlowBrowser-windows-${{ matrix.arch }}
          path: dist/*.zip

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  portable-tests:
    name: Portable core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run all tests
        run: NODE_PATH=$PWD/node_modules tests/run_all.sh --web
